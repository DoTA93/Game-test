<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>कौए की मदद करो</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2a1f4d; --ink:#fff; --sun:#ffd23f; --sun-deep:#c27a00; --plum:#2a1244;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1438}}
:root[data-theme="dark"]{--bg:#1c1438}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;display:grid;place-items:center;
  font-family:'Baloo 2','Noto Sans Devanagari','Mukta',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.phone{--u:3.6px;position:relative;height:100%;aspect-ratio:9/16;max-width:100%;max-height:100%;overflow:hidden;background:#87ceeb;
  border-radius:clamp(0px,2.2vw,28px);box-shadow:0 20px 60px rgba(0,0,0,.45);user-select:none;-webkit-user-select:none}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.item{cursor:pointer;outline:none}
.item .hit{fill:rgba(255,255,255,.001);pointer-events:all}
.item:focus-visible .ring{opacity:1!important;stroke:#ffd23f}
.item.pulse .ic{animation:pulse .8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.4)}}
#crow{cursor:pointer}
#crow .chit{fill:rgba(255,255,255,.001);pointer-events:all}

.pill{position:absolute;top:calc(var(--u)*3);left:calc(var(--u)*3);z-index:6;display:flex;align-items:center;gap:calc(var(--u)*1.6);
  background:rgba(42,18,68,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;
  padding:calc(var(--u)*1.4) calc(var(--u)*3.4);font-weight:800;font-size:calc(var(--u)*4.2);height:calc(var(--u)*9.5)}
.pill svg{width:calc(var(--u)*4.6);height:calc(var(--u)*4.6)}
.pill .on{fill:var(--sun)} .pill .off{fill:rgba(255,255,255,.3)}
.hud{position:absolute;top:calc(var(--u)*3);right:calc(var(--u)*3);display:flex;gap:calc(var(--u)*2);z-index:6}
.hud button{width:calc(var(--u)*9.5);height:calc(var(--u)*9.5);border-radius:50%;border:0;cursor:pointer;background:rgba(42,18,68,.6);color:#fff;
  display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hud button svg{width:55%;height:55%;fill:#fff}
.hud button[aria-pressed="false"]{opacity:.55}
.hud button:focus-visible,.go:focus-visible,.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.say{position:absolute;left:calc(var(--u)*5);right:calc(var(--u)*5);top:calc(var(--u)*16);z-index:5;pointer-events:none;
  background:rgba(255,255,255,.95);color:var(--plum);border-radius:calc(var(--u)*4.5);padding:calc(var(--u)*2.6) calc(var(--u)*4);
  font-weight:700;font-size:calc(var(--u)*4.7);line-height:1.25;text-align:center;box-shadow:0 calc(var(--u)*.8) 0 rgba(42,18,68,.25);
  opacity:0;transform:translateY(calc(var(--u)*-2));transition:opacity .3s,transform .3s}
.say.on{opacity:1;transform:none}

.overlay{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:0 calc(var(--u)*8);transition:opacity .4s}
.overlay.hide{opacity:0;pointer-events:none}
#start{background:radial-gradient(ellipse at 50% 40%,rgba(255,226,120,.28),rgba(42,18,77,.7) 75%)}
#done{background:radial-gradient(ellipse at 50% 45%,rgba(255,226,120,.3),rgba(42,18,77,.78) 80%)}
.title{margin:0;font-weight:800;font-size:calc(var(--u)*12.5);line-height:1.1;color:#fff;
  text-shadow:0 calc(var(--u)*.7) 0 #f5a300,0 calc(var(--u)*1.5) 0 #8a4a00,0 calc(var(--u)*2.4) calc(var(--u)*2.5) rgba(0,0,0,.35)}
.tag{margin:calc(var(--u)*3) 0 calc(var(--u)*9);font-size:calc(var(--u)*5);font-weight:700;color:#fff3c2;text-shadow:0 calc(var(--u)*.4) calc(var(--u)*1) rgba(0,0,0,.5)}
.go{width:calc(var(--u)*27);height:calc(var(--u)*27);border-radius:50%;border:0;cursor:pointer;background:var(--sun);
  box-shadow:0 calc(var(--u)*1.4) 0 var(--sun-deep),0 calc(var(--u)*3) calc(var(--u)*5) rgba(0,0,0,.4);display:grid;place-items:center;transition:transform .15s}
.go:active{transform:translateY(calc(var(--u)*1)) scale(.97)}
.go svg{width:44%;height:44%;fill:var(--plum);margin-left:8%}
.go-label{margin-top:calc(var(--u)*4);font-size:calc(var(--u)*6);font-weight:800;color:#fff;text-shadow:0 calc(var(--u)*.4) calc(var(--u)*1) rgba(0,0,0,.5)}
.note{margin-top:calc(var(--u)*6);font-size:calc(var(--u)*3.9);font-weight:500;color:#ffe9a8;min-height:calc(var(--u)*8)}
.big{font-size:calc(var(--u)*13);font-weight:800;margin:0;text-shadow:0 calc(var(--u)*.7) 0 #f5a300,0 calc(var(--u)*1.5) 0 #8a4a00}
.stars{display:flex;gap:calc(var(--u)*2);margin:calc(var(--u)*4) 0 calc(var(--u)*3)}
.stars svg{width:calc(var(--u)*19);height:calc(var(--u)*19);overflow:visible}
.stars .s{fill:rgba(255,255,255,.25);transform-box:fill-box;transform-origin:center}
.stars .s.f{fill:var(--sun);stroke:#f5a300;stroke-width:3;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.msg{font-size:calc(var(--u)*5.2);font-weight:700;margin:0 0 calc(var(--u)*7);color:#fff;text-shadow:0 calc(var(--u)*.4) calc(var(--u)*1) rgba(0,0,0,.5);line-height:1.25}
.btn{border:0;cursor:pointer;font:800 calc(var(--u)*5.4)/1 'Baloo 2',sans-serif;color:var(--plum);background:var(--sun);
  padding:calc(var(--u)*3) calc(var(--u)*9);border-radius:999px;box-shadow:0 calc(var(--u)*1) 0 var(--sun-deep)}
.btn:active{transform:translateY(calc(var(--u)*.8))}
</style>
</head>
<body>
<div class="phone" id="phone">
<svg id="scene" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice" role="application" aria-label="कौए की मदद करो पहेली">
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="-120" x2="0" y2="400"><stop id="skyA" offset="0" stop-color="#3fa9ef"/><stop id="skyB" offset="1" stop-color="#fff0b0"/></linearGradient>
    <radialGradient id="sunG"><stop offset="0" stop-color="#fffbd0"/><stop offset="1" stop-color="#ffc931"/></radialGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6cf5a"/><stop offset="1" stop-color="#e3a935"/></linearGradient>
    <linearGradient id="grass" gradientUnits="userSpaceOnUse" x1="0" y1="466" x2="0" y2="700"><stop offset="0" stop-color="#8bdc5c"/><stop offset="1" stop-color="#3f9c47"/></linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e88c5a"/><stop offset=".55" stop-color="#cf6a3a"/><stop offset="1" stop-color="#a94b27"/></linearGradient>
    <radialGradient id="crowBody" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#3a4270"/><stop offset=".55" stop-color="#1e2240"/><stop offset="1" stop-color="#10122a"/></radialGradient>
    <linearGradient id="wingG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f3668"/><stop offset="1" stop-color="#12142d"/></linearGradient>
    <linearGradient id="waterG" gradientUnits="userSpaceOnUse" x1="0" y1="380" x2="0" y2="476"><stop offset="0" stop-color="#7fe0ff"/><stop offset="1" stop-color="#2a8fe0"/></linearGradient>
    <clipPath id="potIn"><path d="M208,384 L208,408 C182,422 180,466 202,474 L258,474 C280,466 278,422 252,408 L252,384 Z"/></clipPath>
    <clipPath id="eclip"><circle r="8.6"/></clipPath>
  </defs>

  <rect x="-400" y="-600" width="1160" height="1100" fill="url(#sky)"/>
  <g id="sun" transform="translate(300 70)"><circle r="84" fill="#fff4b0" opacity=".32"/><g id="rays" fill="#ffd84a"></g><circle r="32" fill="url(#sunG)"/></g>
  <g id="clouds"></g>
  <g id="art"></g>

  <!-- tree -->
  <ellipse cx="290" cy="494" rx="90" ry="12" fill="#2d7d3a" opacity=".35"/>
  <path d="M298,492 C297,440 296,380 304,318 L326,318 C332,380 330,440 336,492Z" fill="#8b5a34"/>
  <path d="M306,330 C310,400 312,440 314,492" stroke="#a87444" stroke-width="5" fill="none" opacity=".6" stroke-linecap="round"/>
  <g><circle cx="300" cy="248" r="58" fill="#4fb84f"/><circle cx="352" cy="272" r="50" fill="#45ad4b"/><circle cx="250" cy="236" r="40" fill="#58c256"/><circle cx="332" cy="204" r="48" fill="#5bc659"/><circle cx="285" cy="215" r="34" fill="#68d065" opacity=".8"/></g>
  <path d="M314,302 Q282,292 250,290" stroke="#8b5a34" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- pot (scaled up for the game) -->
  <g id="pot" transform="translate(-142 -202) scale(1.4)">
    <ellipse cx="232" cy="488" rx="62" ry="8" fill="#1f5a2a" opacity=".3"/>
    <ellipse cx="230" cy="484" rx="38" ry="5" fill="#8f3f20"/>
    <path d="M200,380 L200,405 C168,420 166,472 194,483 L266,483 C294,472 292,420 260,405 L260,380 Z" fill="url(#clay)" stroke="#a94b27" stroke-width="2"/>
    <g clip-path="url(#potIn)">
      <rect x="170" y="380" width="120" height="100" fill="#6b3a24"/>
      <rect x="170" y="380" width="120" height="14" fill="#4f2616"/>
      <g id="pebIn"></g>
      <path id="water" fill="url(#waterG)" opacity=".82"/>
      <path id="waterTop" fill="none" stroke="#e3f9ff" stroke-width="1.8" opacity=".9" stroke-linecap="round"/>
      <g id="glints" fill="#fff"></g>
      <g id="splash" fill="#d6f6ff"></g>
      <g id="leafIn"></g>
    </g>
    <path d="M214,392 L214,404 C196,416 192,440 196,456" stroke="#fff" stroke-width="4" fill="none" opacity=".3" stroke-linecap="round"/>
    <path d="M208,384 L208,408 C182,422 180,466 202,474 L258,474 C280,466 278,422 252,408 L252,384 Z" fill="none" stroke="#8f4a2a" stroke-width="2.2"/>
    <line x1="209" y1="394" x2="251" y2="394" stroke="#fff3a0" stroke-width="1.6" stroke-dasharray="4 3" opacity=".95"/>
    <path id="goalDrop" d="M266,386 q-6,9 0,12 q6,-3 0,-12" fill="#ffe14d" stroke="#e08a00" stroke-width="1.2"/>
    <ellipse cx="230" cy="380" rx="36" ry="9" fill="#e7915f" stroke="#a94b27" stroke-width="3"/>
    <ellipse cx="230" cy="381" rx="29" ry="5.5" fill="#5a2f1d"/>
  </g>

  <!-- tray -->
  <rect x="10" y="506" width="340" height="140" rx="26" fill="#c99a63" opacity=".6"/>
  <rect x="10" y="506" width="340" height="140" rx="26" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="3 7" stroke-linecap="round" opacity=".5"/>
  <g id="items"></g>
  <ellipse id="crowShadow" rx="26" ry="5" fill="#1f4d2a" opacity="0"/>

  <g id="crow">
    <circle class="chit" cx="10" cy="-6" r="48"/>
    <g id="cLegs"><g stroke="#e0963f" stroke-width="3.6" stroke-linecap="round" fill="none">
      <path d="M-6,20 L-8,35 M-8,35 l-6,3 M-8,35 l0,4 M-8,35 l5,3"/><path d="M8,20 L6,35 M6,35 l-6,3 M6,35 l0,4 M6,35 l5,3"/></g></g>
    <g id="cTail"><path d="M-24,-2 L-62,-10 Q-67,4 -60,16 Q-44,13 -24,12Z" fill="#14172a"/><path d="M-30,3 L-56,-3" stroke="#3a4270" stroke-width="2" opacity=".6" stroke-linecap="round"/></g>
    <g id="wingB"><path d="M0,0 C-16,-14 -50,-10 -64,8 C-44,16 -16,16 0,6Z" fill="#0d0f22"/></g>
    <ellipse cx="0" cy="0" rx="30" ry="24" fill="url(#crowBody)"/>
    <path d="M-18,-13 Q0,-23 17,-13" stroke="#5367b4" stroke-width="3" fill="none" opacity=".55" stroke-linecap="round"/>
    <g id="cHead">
      <circle cx="24" cy="-22" r="21" fill="url(#crowBody)"/>
      <path d="M10,-38 Q22,-46 36,-40" stroke="#5367b4" stroke-width="3" fill="none" opacity=".55" stroke-linecap="round"/>
      <circle cx="12" cy="-12" r="4.6" fill="#ff7a9a" opacity=".4"/><circle cx="37" cy="-11" r="4.6" fill="#ff7a9a" opacity=".4"/>
      <g id="eye1" transform="translate(19 -27)"><g clip-path="url(#eclip)"><circle r="8.6" fill="#fff"/><g class="pup"><circle r="5.4" fill="#0a0c1c"/><circle cx="-1.9" cy="-2.1" r="2.2" fill="#fff"/><circle cx="2" cy="2" r="1" fill="#fff" opacity=".9"/></g><rect class="lid" x="-10" y="-10" width="20" height="0" fill="#1b1e38"/></g></g>
      <g id="eye2" transform="translate(36 -27)"><g clip-path="url(#eclip)"><circle r="8.6" fill="#fff"/><g class="pup"><circle r="5.4" fill="#0a0c1c"/><circle cx="-1.9" cy="-2.1" r="2.2" fill="#fff"/><circle cx="2" cy="2" r="1" fill="#fff" opacity=".9"/></g><rect class="lid" x="-10" y="-10" width="20" height="0" fill="#1b1e38"/></g></g>
      <g id="eyeShut" stroke="#f6f3ff" stroke-width="2.8" fill="none" stroke-linecap="round" opacity="0"><path d="M12,-25 Q19,-34 26,-25"/><path d="M29,-25 Q36,-34 43,-25"/></g>
      <path id="smile" d="M22,-6 Q29,3 37,-6" stroke="#ff9fb5" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0"/>
      <path d="M42,-27 Q64,-23 67,-14 Q54,-12 42,-14Z" fill="#2d2d38"/>
      <path d="M46,-24 Q58,-22 63,-17" stroke="#6b6b7c" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".8"/>
      <g id="beakLo"><path d="M42,-14 Q56,-12 62,-9 Q52,-4 42,-8Z" fill="#1d1d26"/></g>
      <path id="sweat" d="M44,-44 q-5,9 0,12 q5,-3 0,-12" fill="#7fd6ff" stroke="#bdeaff" stroke-width=".8" opacity="0"/>
    </g>
    <g id="wingF"><path d="M0,0 C-16,-16 -52,-12 -66,8 C-44,18 -14,18 0,6Z" fill="url(#wingG)"/><path d="M-14,2 Q-36,-2 -52,6 M-12,8 Q-32,8 -48,12" stroke="#4a5a9c" stroke-width="1.8" fill="none" opacity=".55" stroke-linecap="round"/></g>
  </g>

  <g id="fx">
    <g id="carry" opacity="0"><g id="carryIn"></g></g>
    <g id="bQues" opacity="0"><circle r="13" fill="#d7ecff" stroke="#4a86c9" stroke-width="2.5"/><path d="M-4.6,-3.5 Q-4.6,-8.6 0,-8.6 Q4.6,-8.6 4.6,-4 Q4.6,0 0,2 L0,4" stroke="#27518a" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cy="8.4" r="1.9" fill="#27518a"/></g>
    <g id="bHeart" opacity="0"><circle r="13" fill="#ffd9e3" stroke="#e0527a" stroke-width="2.5"/><path d="M0,6 C-9,-1 -7,-8 0,-4 C7,-8 9,-1 0,6Z" fill="#e0527a"/></g>
    <g id="stars" fill="#fff7b0"></g>
  </g>
  <rect id="heat" x="0" y="0" width="360" height="640" fill="#ff9d3a" opacity=".18" pointer-events="none"/>
</svg>

<div class="pill" id="pill"><span id="lvl">स्तर 1</span>
  <svg viewBox="0 0 24 24" class="off"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z"/></svg>
</div>
<div class="say" id="say" aria-live="polite"></div>
<div class="hud">
  <button id="bHint" type="button" aria-label="मदद सुनें"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2zM9 20h6v1.5a.5.5 0 0 1-.5.5h-5a.5.5 0 0 1-.5-.5z"/></svg></button>
  <button id="bVoice" type="button" aria-label="आवाज़ बदलें"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg></button>
    <button id="bRestart" type="button" aria-label="स्तर फिर से शुरू करें"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
  <button id="bSnd" type="button" aria-label="संगीत और आवाज़ें" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12a3 3 0 1 1-2-2.8V7.3L11 8.5V18a3 3 0 1 1-2-2.8z" transform="translate(-1 1)"/></svg></button>
</div>

<div class="overlay" id="start">
  <h1 class="title">कौए की मदद करो</h1>
  <p class="tag">प्यासे कौए की पहेली</p>
  <button class="go" id="bGo" type="button" aria-label="खेल शुरू करें"><svg viewBox="0 0 24 24"><path d="M7 4v16l14-8z"/></svg></button>
  <div class="go-label">खेलो</div>
  <div class="note" id="note">आवाज़ चालू रखिए</div>
</div>
<div class="overlay hide" id="done">
  <h2 class="big" id="dTitle">शाबाश!</h2>
  <div class="stars" id="dStars"></div>
  <p class="msg" id="dMsg"></p>
  <button class="btn" id="bNext" type="button">अगला स्तर</button>
</div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,u)=>a+(b-a)*u;
const sm=u=>u*u*(3-2*u);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const NS='http://www.w3.org/2000/svg';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const tw=(ms,fn,ease=sm)=>new Promise(res=>{const t0=performance.now();(function step(n){const u=clamp((n-t0)/ms);fn(ease(u),u);if(u<1)requestAnimationFrame(step);else res();})(t0);});

/* ---------- static scenery ---------- */
function house(x,y,wall,roof){return `<g transform="translate(${x} ${y})"><rect width="46" height="34" rx="3" fill="${wall}"/><path d="M-6,2 L23,-24 L52,2Z" fill="${roof}"/><rect x="18" y="15" width="10" height="19" rx="2" fill="#8a4b2a"/><rect x="5" y="9" width="8" height="8" rx="1.5" fill="#bfe8ff"/><rect x="34" y="9" width="8" height="8" rx="1.5" fill="#bfe8ff"/></g>`}
function palm(x,y,h,lean){const tx=x+lean,ty=y-h;let f='';[[-36,-6],[-26,-24],[0,-30],[26,-24],[36,-6],[-18,8],[18,8]].forEach(([dx,dy])=>{f+=`<path d="M${tx},${ty} Q${tx+dx*.5},${ty+dy-12} ${tx+dx},${ty+dy+10}" stroke="#2f9e4f" stroke-width="6" stroke-linecap="round" fill="none"/>`});return `<path d="M${x},${y} Q${x+lean*.2},${y-h*.5} ${tx},${ty}" stroke="#9a6a3a" stroke-width="6" fill="none" stroke-linecap="round"/>${f}<circle cx="${tx-3}" cy="${ty+5}" r="4" fill="#6b4a2a"/>`}
let art=`<path d="M-400,386 Q-180,300 20,362 T330,340 T620,360 L620,520 L-400,520Z" fill="#8fd488"/>`;
art+=palm(40,404,82,8)+house(8,372,'#f6dcae','#c8553a')+house(60,378,'#ffd1b0','#a9452f')+house(262,376,'#f2e6b8','#d46a3c');
art+=`<path d="M-400,404 Q-100,372 120,396 T400,388 T700,400 L700,520 L-400,520Z" fill="#6fbd6a"/>`;
art+=`<rect x="-400" y="408" width="1160" height="68" fill="url(#field)"/>`;
for(let i=0;i<5;i++){const y=418+i*11;art+=`<path d="M-400,${y} Q-100,${y-3} 200,${y+1} T760,${y}" stroke="#cf9a2f" stroke-width="${1+i*.35}" fill="none" opacity=".45"/>`}
art+=`<path d="M-400,472 Q-200,458 -40,470 T250,468 T520,472 L520,900 L-400,900Z" fill="url(#grass)"/>`;

function tipPos(){

async function turn(f){if(cs.flip===f)return;const f0=cs.flip;await tw(130,u=>{cs.flip=lerp(f0,f,u)});cs.flip=f}

  const x0=cs.x,y0=cs.y,leg0=cs.leg,fb0=cs.fb;

    cs.x=lerp(x0,x,u);cs.y=lerp(y0,y,u)-arc*Math.sin(Math.PI*u);
    cs.fb=Math.max(fb0,sm(seg(u,0,.12)));cs.leg=Math.max(leg0,65*sm(seg(u,0,.2)));
    if(land){cs.fb=Math.min(cs.fb,1-sm(seg(u,.82,1)));cs.leg=Math.min(cs.leg,65*(1-sm(seg(u,.65,1))))}

let AC=null,master,musicBus,sfxBus,noiseBuf,soundOn=true,musicStep=0,musicNext=0;
function initAudio(){
  if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null;return}
  master=AC.createGain();master.connect(AC.destination);
  musicBus=AC.createGain();musicBus.gain.value=.38;musicBus.connect(master);
  sfxBus=AC.createGain();sfxBus.gain.value=.9;sfxBus.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
  musicNext=AC.currentTime+.2;
}
function tone(f,t0,d,type,g,bus,f2){const o=AC.createOscillator(),gn=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  gn.gain.setValueAtTime(.0001,t0);gn.gain.exponentialRampToValueAtTime(g,t0+.012);gn.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(gn).connect(bus||sfxBus);o.start(t0);o.stop(t0+d+.05)}
function noise(t0,d,freq,q,g,type){const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q;
  const gn=AC.createGain();gn.gain.setValueAtTime(.0001,t0);gn.gain.exponentialRampToValueAtTime(g,t0+d*.2);gn.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(f).connect(gn).connect(sfxBus);s.start(t0,Math.random());s.stop(t0+d+.05)}
function sfx(k){if(!AC||AC.state!=='running')return;const n=AC.currentTime+.01;
  switch(k){
    case'flap':noise(n,.1,700,.7,.09,'lowpass');break;
    case'tap':tone(900,n,.06,'triangle',.14,sfxBus,500);break;
    case'plop':tone(420,n,.14,'sine',.26,sfxBus,150);noise(n,.22,1800,.6,.14);break;
    case'glug':tone(280,n,.16,'sine',.22,sfxBus,120);break;
    case'ting':tone(1760,n,.9,'sine',.11);tone(2637,n+.08,.8,'sine',.08);break;
    case'bonk':tone(220,n,.18,'triangle',.28,sfxBus,90);break;
    case'oops':tone(360,n,.35,'triangle',.12,sfxBus,240);break;
    case'good':tone(660,n,.18,'triangle',.12);tone(990,n+.09,.25,'triangle',.12);break;
    case'cheer':[523,659,784,1047,1319].forEach((f,i)=>tone(f,n+i*.11,.5,'triangle',.14));break;
  }}
const CH=[[48,[72,76,79,76,72,76,79,84]],[43,[71,74,79,74,71,74,79,83]],[45,[69,72,76,72,69,72,76,81]],[41,[69,72,77,72,69,72,77,81]]];
const mtof=m=>440*Math.pow(2,(m-69)/12);
setInterval(()=>{if(!AC||AC.state!=='running')return;
  while(musicNext<AC.currentTime+.4){const bar=Math.floor(musicStep/8)%4,k=musicStep%8,[bass,mel]=CH[bar],f=mtof(mel[k]);
    tone(f,musicNext,.5,'sine',.09,musicBus);tone(f*2,musicNext,.14,'sine',.02,musicBus);if(k===0||k===4)tone(mtof(bass),musicNext,.5,'triangle',.1,musicBus);musicNext+=.3;musicStep++}},100);

const hasSpeech='speechSynthesis' in window;
let hiVoice=null,voiceList=[],tq=[],tBusy=false,tGap=0,tGen=0;
const VKEY='kauaa-voice';
function scoreVoice(v){const n=v.name;let s=0;if(/natural|neural|online|wavenet/i.test(n))s+=4;if(/google/i.test(n))s+=3;if(/swara|neerja|lekha|kalpana|aditi|heera/i.test(n))s+=2;if(/madhur|hemant|rishi/i.test(n))s-=1;if(!v.localService)s+=1;if(/espeak/i.test(n))s-=6;return s}
function pickVoice(){
  if(!hasSpeech)return;
  voiceList=speechSynthesis.getVoices().filter(v=>/^hi/i.test(v.lang)||/hindi|हिन्दी|हिंदी/i.test(v.name)).sort((a,b)=>scoreVoice(b)-scoreVoice(a));
  let saved=null;try{saved=localStorage.getItem(VKEY)}catch(e){}
  hiVoice=voiceList.find(v=>v.name===saved)||voiceList[0]||null;
}
if(hasSpeech){pickVoice();speechSynthesis.addEventListener&&speechSynthesis.addEventListener('voiceschanged',pickVoice)}
/* Punctuation is never read aloud: text is split into short phrases, symbols are removed,
   and the punctuation is turned into natural pauses and a little pitch lift instead. */
function phrases(text){
  const out=[];const parts=text.replace(/[-–—]/g,' ').split(/([,،]|[।!?:;.…]+)/);
  for(let i=0;i<parts.length;i+=2){
    const t=(parts[i]||'').replace(/[“”"'‘’()\[\]*_~#|\\\/]/g,' ').replace(/\s+/g,' ').trim();
    const sep=parts[i+1]||'';if(!t)continue;
    out.push({t,gap:/^[,،]$/.test(sep)?170:sep?420:0,ex:/!/.test(sep),q:/\?/.test(sep)});
  }
  return out;
}
function pump(){
  if(tBusy||!tq.length||!hasSpeech)return;
  const p=tq.shift(),gen=tGen;tBusy=true;
  const u=new SpeechSynthesisUtterance(p.t);u.lang='hi-IN';if(hiVoice)u.voice=hiVoice;
  u.rate=p.ex?.94:.9;u.pitch=p.ex?1.12:(p.q?1.1:1.03);u.volume=1;
  const done=()=>{if(gen!==tGen)return;clearTimeout(tGap);tGap=setTimeout(()=>{if(gen!==tGen)return;tBusy=false;pump()},p.gap)};
  u.onend=done;u.onerror=done;
  speechSynthesis.speak(u);
}
function speakText(text,{interrupt=false}={}){if(!hasSpeech)return;if(interrupt)stopSpeech();phrases(text).forEach(p=>tq.push(p));pump()}
function stopSpeech(){tGen++;tq=[];clearTimeout(tGap);tGap=0;tBusy=false;if(hasSpeech)speechSynthesis.cancel()}
const speaking=()=>hasSpeech&&(tBusy||tq.length>0);
function nextVoice(){
  if(!voiceList.length)return null;
  const i=Math.max(0,voiceList.indexOf(hiVoice));hiVoice=voiceList[(i+1)%voiceList.length];
  try{localStorage.setItem(VKEY,hiVoice.name)}catch(e){}
  return hiVoice;
}
let sayTimer=0;
function say(text,{voice=true,ms=7000}={}){
  const el=$('say');el.textContent=text;el.classList.add('on');clearTimeout(sayTimer);sayTimer=setTimeout(()=>el.classList.remove('on'),ms);
  if(voice&&soundOn)speakText(text,{interrupt:true});

/* ---------- gameplay ---------- */
function tapItem(it){
  if(!started||over||it.used||it.queued)return;
  lastAct=Date.now();hintStep=Math.max(0,hintStep);
  it.queued=true;it.ring.setAttribute('opacity',1);it.g.classList.remove('pulse');sfx('tap');
  queue.push(it);if(!working)work();
}
async function work(){
  working=true;
  while(queue.length&&!over){
    const it=queue.shift();await handle(it);
    if(L<=GOAL)break;
  }
  queue.forEach(q=>{q.queued=false;q.ring.setAttribute('opacity',0)});queue=[];
  if(L<=GOAL)await win();else await perch();
  working=false;lastAct=Date.now();
}
async function perch(){
  await turn(1);await flyTo(HOME.x,HOME.y,{ms:700*SP(),arc:30});cs.tilt=0;cs.beak=0;
}
async function handle(it){
  const sp=SP(),T=TYPES[it.type];
  cs.lookY=.6;cs.lid=0;
  const f=it.x<cs.x?-1:1;await turn(f);
  await flyTo(it.x-38*f,it.y-32,{ms:700*sp,arc:40});
  // peck & pick up
  await tw(260*sp,u=>{cs.tilt=70*u;cs.beak=.8*Math.sin(Math.PI*u)},t=>t);
  it.g.style.display='none';it.ring.setAttribute('opacity',0);setCarry(it,true);sfx('tap');
  await tw(200*sp,u=>{cs.tilt=70*(1-u)});cs.beak=0;
  // fly to the pot
  await turn(1);
  cs.lookY=.2;
  const carryTick=setInterval(()=>{});clearInterval(carryTick);
  await flyTo(HP.x,HP.y,{ms:800*sp,arc:50,land:false});
  await tw(110,u=>{cs.tilt=22*u;cs.beak=u});
  const [tx,ty]=tipPos();
  setCarry(null,false);carrying=null;
  carryIn.innerHTML=icon(it.type,it.col);carryIn.setAttribute('transform',`scale(${T.k})`);carryEl.setAttribute('opacity',1);
  carryRot=0;placeCarry(tx,ty,0);
  cs.beak=0;
  if(it.type==='pebble')await dropPebble(it,tx,ty,sp);
  else if(T.float)await dropFloat(it,tx,ty,T,sp);
  else await dropBonk(it,tx,ty,T,sp);
  await tw(120,u=>{cs.tilt=22*(1-u)});cs.tilt=0;
  if(!queue.length&&L>GOAL){/* perch handled by work() */}
}
async function dropPebble(it,tx,ty,sp){
  const slot=SLOTS[placed],[wx,wy]=P2W(slot[0],slot[1]);
  await tw(340*sp,(u,r)=>{placeCarry(lerp(tx,wx,u),lerp(ty,wy,r*r),0)},t=>t);
  carryEl.setAttribute('opacity',0);piEl[placed].setAttribute('opacity',1);
  sfx('plop');splashAt(slot[0],Math.min(L,slot[1]-6));it.used=true;
  const idx=placed;placed++;
  const newL=REST-(REST-386)*(placed/LEVELS[level].N);
  const l0=L;await tw(340*sp,u=>{L=lerp(l0,Math.max(newL,386),u)});
  cs.smile=.8;
  if(L>GOAL){if(placed===1)say('वाह! पानी थोड़ा ऊपर आया। और डालो!',{ms:3500});else if(placed%3===0)say('बहुत बढ़िया! पानी ऊपर आ रहा है!',{ms:2500})}
  else sfx('good');
}
async function dropFloat(it,tx,ty,T,sp){
  const surf=1.4*L-202;wrongs++;
  await tw(900,(u,r)=>{placeCarry(lerp(tx,180,u)+Math.sin(u*10)*16*(1-u),lerp(ty,surf-4,u),Math.sin(u*9)*25*(1-u))},t=>t);
  sfx('oops');sad(T.msg);
  await tw(700,u=>{placeCarry(180+Math.sin(u*8)*5,surf-4+Math.sin(u*12)*2,Math.sin(u*6)*10)},t=>t);
  await tw(300,u=>carryEl.setAttribute('opacity',1-u),t=>t);
  carryEl.setAttribute('opacity',0);it.used=true;
}
async function dropBonk(it,tx,ty,T,sp){
  wrongs++;
  await tw(260,(u,r)=>{placeCarry(lerp(tx,182,u),lerp(ty,314,r*r),lerp(0,18,u))},t=>t);
  sfx('bonk');sad(T.msg);potShake=1;
  const bx=182,by=314;
  await tw(900*Math.max(.7,sp),(u,r)=>{placeCarry(lerp(bx,it.x,u),lerp(by,it.y,u)-90*Math.sin(Math.PI*u),lerp(18,360,u))},sm);
  carryEl.setAttribute('opacity',0);it.g.style.display='';it.queued=false;
}
function sad(msg){
  say(msg,{ms:6000});cs.lid=.4;cs.lookY=.5;
  const q=$('bQues');let n=0;
  tw(1500,(u)=>{const k=sm(seg(u,0,.15))*(1-sm(seg(u,.85,1)));q.setAttribute('opacity',k>0?1:0);q.setAttribute('transform',`translate(${(cs.x+24*cs.flip).toFixed(1)} ${(cs.y-62).toFixed(1)}) scale(${k.toFixed(2)})`)},t=>t);
  setTimeout(()=>{cs.lid=0},1400);
}
function splashAt(x,y){
  const els=[...$('splash').children];const t0=performance.now();
  (function step(n){const tau=(n-t0)/1000;if(tau>.45){els.forEach(e=>e.setAttribute('opacity',0));return}
    els.forEach((e,j)=>{const vx=[-24,-11,0,12,25][j],vy=[60,88,100,82,55][j];e.setAttribute('cx',(x+vx*tau*.5).toFixed(1));e.setAttribute('cy',(y-(vy*tau-170*tau*tau)).toFixed(1));e.setAttribute('r',(2.4*(1-tau/.45)).toFixed(2));e.setAttribute('opacity',.9)});requestAnimationFrame(step)})(t0);
}
async function tryDrink(){
  if(!started||over||working)return;
  working=true;lastAct=Date.now();
  await perch();
  await tw(500,u=>{cs.tilt=80*u;cs.dy=8*u;cs.lookY=.8});
  if(L<=GOAL){working=false;await win(true);return}
  for(let i=0;i<2;i++)await tw(260,u=>{cs.beak=Math.sin(u*Math.PI);cs.dy=8+4*Math.sin(u*Math.PI)},t=>t);
  sfx('oops');
  await tw(400,u=>{cs.tilt=80*(1-u);cs.dy=8*(1-u)});
  for(let i=0;i<2;i++)await tw(220,u=>{cs.dx=Math.sin(u*Math.PI*2)*5},t=>t);
  cs.dx=0;cs.beak=0;
  sad('चोंच पानी तक नहीं पहुँच रही! पानी को ऊपर लाना होगा।');
  working=false;
}
async function win(already){
  over=true;
  if(!already){await perch();await tw(500,u=>{cs.tilt=80*u;cs.dy=8*u;cs.lookY=.8})}
  cs.closed=1;cs.smile=1;
  sparkle=1;sfx('cheer');
  for(let i=0;i<4;i++){sfx('glug');await tw(300,u=>{cs.tilt=80+5*Math.sin(u*Math.PI);L=Math.max(380,L-.5)},t=>t)}
  say('शाबाश! कौए को पानी मिल गया!',{ms:4000});
  cs.closed=0;
  await tw(400,u=>{cs.tilt=80*(1-u);cs.dy=8*(1-u)});
  await tw(400,u=>{cs.wf=lerp(-10,70,u);cs.wb=lerp(-14,60,u);cs.lookY=0});
  cs.wf=null;cs.wb=null;
  await flyTo(340,30,{ms:1100,arc:50,land:false});
  sparkle=0;cs.fb=0;
  showDone();
}
function starsFor(w){return w===0?3:w<=2?2:1}
function showDone(){
  const r=starsFor(wrongs);levelStars[level]=r;
  const last=level===LEVELS.length-1;
  $('dTitle').textContent=last?'सीख':'शाबाश!';
  $('dMsg').textContent=last?'जहाँ चाह, वहाँ राह! समझदारी से हर मुश्किल का हल मिल सकता है।':'कौए को पानी मिल गया!';
  $('bNext').textContent=last?'फिर से खेलें':'अगला स्तर';
  const total=last?levelStars.reduce((a,b)=>a+b,0):r,max=last?LEVELS.length*3:3;
  $('dStars').innerHTML=last?[...Array(3)].map((_,i)=>starSvg(i<Math.round(total/LEVELS.length),i)).join(''):[...Array(3)].map((_,i)=>starSvg(i<r,i)).join('');
  $('done').classList.remove('hide');
  setTimeout(()=>sfx('ting'),300);
  say(last?'जहाँ चाह, वहाँ राह! समझदारी से हर मुश्किल का हल मिल सकता है।':(r===3?'वाह! तीन सितारे!':'बहुत अच्छे!'),{ms:6000});
  document.querySelectorAll('#pill svg').forEach(s=>s.setAttribute('class',r>=1?'on':'off'));
}
const starSvg=(f,i)=>`<svg viewBox="-12 -12 24 24"><path class="s ${f?'f':''}" style="animation-delay:${i*.25+.2}s" d="M0,-10 L2.9,-3.4 L10,-2.8 L4.6,1.9 L6.2,9 L0,5.3 L-6.2,9 L-4.6,1.9 L-10,-2.8 L-2.9,-3.4Z"/></svg>`;

async function setupLevel(i){
  level=i;over=true;working=false;queue=[];wrongs=0;placed=0;hintStep=0;sparkle=0;L=REST;
  piEl.forEach(e=>e.setAttribute('opacity',0));
  buildItems(LEVELS[i]);
  $('lvl').textContent='स्तर '+(i+1);
  document.querySelectorAll('#pill svg').forEach(s=>s.setAttribute('class','off'));
  Object.assign(cs,base());cs.sweat=1;cs.lid=.3;cs.lookY=.5;
  $('done').classList.add('hide');
  say(LEVELS[i].msg,{ms:9000});
  await flyTo(HOME.x,HOME.y,{ms:1400,arc:40});
  cs.tilt=0;over=false;lastAct=Date.now();
}
function giveHint(){
  if(over||working||!started)return;
  lastAct=Date.now();
  if(hintStep===0)say('कौए की मदद करो! कोई चीज़ चुनो और घड़े में डालकर देखो।');
  else{say('कंकड़ भारी होते हैं और पानी में डूब जाते हैं। कंकड़ आज़माओ!');items.forEach(it=>{if(it.type==='pebble'&&!it.used)it.g.classList.add('pulse')})}
  hintStep++;
}
setInterval(()=>{if(started&&!over&&!working&&Date.now()-lastAct>15000)giveHint()},1000);

/* ---------- frame loop ---------- */
const cam={};
const skyA=$('skyA'),skyB=$('skyB'),heat=$('heat'),rays=$('rays'),water=$('water'),waterTop=$('waterTop'),glintEls=[...$('glints').children],starEls=[...$('stars').children],pot=$('pot'),goalDrop=$('goalDrop');
let T=0,lastT=performance.now(),lastFlap=0,prevSin=0;
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;T+=dt;
  const prog=clamp((REST-L)/(REST-GOAL));
  heat.setAttribute('opacity',(.2*(1-prog)).toFixed(3));
  rays.setAttribute('transform',`rotate(${((T*7)%360).toFixed(1)})`);
  [...cloudG.children].forEach(g=>{const[x,y,sp]=g._d;g.setAttribute('transform',`translate(${(((x+T*sp)%560)-100).toFixed(1)} ${y})`)});
  if(!working&&!over){ // idle expressions
    cs.sweat=prog<.35?1:0;cs.lid=prog<.35?.3:0;cs.smile=prog>.5?.8:0;cs.lookY=prog<.35?.5:.1;
    cs.tilt=prog<.35?10:0;
  }
  if(cs.fb>.5){const sn=Math.sin(T*12);if(prevSin<=0&&sn>0&&T-lastFlap>.3){sfx('flap');lastFlap=T}prevSin=sn}
  applyCrow(cs,T);
  if(carrying){const [tx,ty]=tipPos();placeCarry(tx,ty,cs.flip*(cs.tilt*.3));}
  // water
  let d=`M176,${L.toFixed(1)}`,top=`M180,${(L+1.8*Math.sin(180*.18+T*4)).toFixed(1)}`;
  for(let x=180;x<=284;x+=8){const yy=(L+1.8*Math.sin(x*.18+T*4)).toFixed(1);d+=` L${x},${yy}`;top+=` L${x},${yy}`}
  water.setAttribute('d',d+' L284,480 L176,480Z');waterTop.setAttribute('d',top);
  glintEls.forEach((g,i)=>{const[gx,gy]=GLINTS[i];const k=Math.max(0,Math.sin(T*3+i*2));const yy=Math.max(gy,L+10+i*8);g.setAttribute('transform',`translate(${gx} ${yy}) scale(${k.toFixed(2)})`);g.setAttribute('opacity',L>470?0:k*.9)});
  goalDrop.setAttribute('opacity',L<=GOAL?0:.6+.4*Math.sin(T*5));
  goalDrop.setAttribute('transform',`translate(0 ${(Math.sin(T*5)*1.5).toFixed(1)})`);
  if(potShake>0){potShake=Math.max(0,potShake-dt*4);pot.setAttribute('transform',`translate(${(-142+Math.sin(T*60)*3*potShake).toFixed(1)} -202) scale(1.4)`)}
  starEls.forEach((e,i)=>{const[x,y]=SPK[i];const k=sparkle?Math.max(0,.6+.5*Math.sin(T*7+i*1.7)):0;e.setAttribute('transform',`translate(${x} ${y}) scale(${(k*1.4).toFixed(2)})`);e.setAttribute('opacity',sparkle?1:0)});
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- UI ---------- */
const phone=$('phone');
new ResizeObserver(()=>phone.style.setProperty('--u',(phone.clientWidth/100)+'px')).observe(phone);
phone.style.setProperty('--u',(phone.clientWidth/100)+'px');
function begin(){
  initAudio();if(AC)AC.resume();
  if(hasSpeech){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
  started=true;$('start').classList.add('hide');setupLevel(0);
}
$('bGo').addEventListener('click',begin);
$('bNext').addEventListener('click',()=>{if(level>=LEVELS.length-1){levelStars.length=0;setupLevel(0)}else setupLevel(level+1)});
$('bHint').addEventListener('click',()=>{if(!started){begin();return}giveHint()});
$('bRestart').addEventListener('click',()=>{if(started&&!working)setupLevel(level)});
$('bVoice').addEventListener('click',()=>{const v=nextVoice();stopSpeech();$('say').textContent=v?('आवाज़: '+v.name):'हिंदी आवाज़ नहीं मिली';$('say').classList.add('on');if(v)speakText('कौआ बहुत प्यासा है, कौए की मदद करो!');});
$('bSnd').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.setAttribute('aria-pressed',soundOn);if(master)master.gain.value=soundOn?1:0;if(!soundOn)stopSpeech()});
$('crow').addEventListener('pointerdown',e=>{e.preventDefault();tryDrink()});

// poster behind start screen
cs.x=HOME.x;cs.y=HOME.y;cs.sweat=1;cs.lid=.3;cs.lookY=.5;cs.tilt=10;
buildItems(LEVELS[0]);
const note=$('note');
if(!hasSpeech)note.textContent='इस ब्राउज़र में आवाज़ नहीं है, लिखा हुआ पढ़िए';
else setTimeout(()=>{pickVoice();note.textContent=hiVoice?('आवाज़: '+hiVoice.name):'हिंदी आवाज़ नहीं मिली, लिखा हुआ पढ़िए'},1200);
window.__game={tap:i=>tapItem(items[i]),items:()=>items,state:()=>({L,placed,wrongs,over,working,level}),begin};
})();
</script>
